<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F3EA;
    --ink: #3D3226;
    --ink-soft: #6B5E4F;
    --sage: #6B7A4F;
    --sage-deep: #55613F;
    --sage-pale: #E9EDE2;
    --border: #DCD3BC;
    --rust: #A34A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--parchment);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    background: #FFFEFB;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.25rem;
    margin: 0;
  }
  .logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .logout:hover { border-color: var(--sage); color: var(--sage-deep); }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .toolbar h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0;
  }
  button.primary {
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.primary:hover { background: var(--sage-deep); }

  .search-wrap {
    position: relative;
    margin-bottom: 18px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  #clientSearch {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.88rem;
    background: #FFFEFB;
    color: var(--ink);
  }
  #clientSearch:focus { outline: 2px solid var(--sage); outline-offset: 1px; }
  .search-count {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: -10px 0 18px 2px;
  }

  .client-list { display: flex; flex-direction: column; gap: 10px; }
  .client-card {
    background: #FFFEFB;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .client-card:hover { border-color: var(--sage); }
  .client-name { font-weight: 600; font-size: 0.98rem; }
  .client-meta { color: var(--ink-soft); font-size: 0.8rem; margin-top: 3px; }
  .chevron { color: var(--ink-soft); font-size: 1.1rem; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state p { font-size: 0.9rem; margin-bottom: 20px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61, 50, 38, 0.35);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.visible { display: flex; }
  .modal {
    background: #FFFEFB;
    border-radius: 4px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 20px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    background: var(--parchment);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--sage); outline-offset: 1px; background: #fff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; }
  button.secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 10px 18px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .error {
    background: #FBEFEC;
    border: 1px solid var(--rust);
    color: var(--rust);
    padding: 9px 12px;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-bottom: 14px;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 30 L28 30 L25.5 38 L14.5 38 Z" fill="#B08A4E"/>
      <rect x="11" y="27.5" width="18" height="3" rx="1.5" fill="#96794A"/>
      <ellipse cx="13.9" cy="23.9" rx="3" ry="7.5" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(-50 13.9 23.9)"/>
      <ellipse cx="16.6" cy="21.8" rx="3" ry="7.8" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(-25 16.6 21.8)"/>
      <ellipse cx="20" cy="20.5" rx="3.2" ry="8.5" fill="#55613F" stroke="#3D3226" stroke-width="0.4" transform="rotate(0 20 20.5)"/>
      <ellipse cx="23.4" cy="21.8" rx="3" ry="7.8" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(25 23.4 21.8)"/>
      <ellipse cx="26.1" cy="23.9" rx="3" ry="7.5" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(50 26.1 23.9)"/>
    </svg>
    <h1 id="practitionerName">Practice Dashboard</h1>
  </div>
  <button class="logout" id="logoutBtn">Sign out</button>
</header>

<main>
  <div class="toolbar">
    <h2>Clients</h2>
    <div style="display:flex;gap:8px;">
      <button class="secondary" id="exportAllBtn">Export All Data</button>
      <button class="primary" id="addClientBtn">+ Add Client</button>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="8.5" cy="8.5" r="6"/>
      <line x1="13" y1="13" x2="18" y2="18" stroke-linecap="round"/>
    </svg>
    <input type="text" id="clientSearch" placeholder="Search clients by name, email, or phone…">
  </div>
  <div class="search-count" id="searchCount" style="display:none;"></div>

  <div class="client-list" id="clientList"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No clients yet. Add your first client to get started.</p>
    <button class="primary" id="emptyAddBtn">+ Add Client</button>
  </div>

  <div class="empty-state" id="noMatchState" style="display:none;">
    <p>No clients match your search.</p>
  </div>
</main>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3>Add a new client</h3>
    <div class="error" id="modalError"></div>
    <form id="addClientForm">
      <div class="field">
        <label for="cFullName">Full name</label>
        <input type="text" id="cFullName" required>
      </div>
      <div class="field">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail">
      </div>
      <div class="field">
        <label for="cPhone">Phone</label>
        <input type="tel" id="cPhone">
      </div>
      <div class="field">
        <label for="cDob">Date of birth</label>
        <input type="date" id="cDob">
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveClientBtn">Add Client</button>
      </div>
    </form>
  </div>
</div>

<script>
  const BACKEND_URL = "https://practitioner-api.val.run";

  const clientList = document.getElementById("clientList");
  const emptyState = document.getElementById("emptyState");
  const noMatchState = document.getElementById("noMatchState");
  const searchCount = document.getElementById("searchCount");
  const searchInput = document.getElementById("clientSearch");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalError = document.getElementById("modalError");
  const addClientForm = document.getElementById("addClientForm");

  let allClients = [];

  function showModalError(msg) {
    modalError.textContent = msg;
    modalError.classList.add("visible");
  }
  function clearModalError() {
    modalError.classList.remove("visible");
  }

  function openModal() {
    clearModalError();
    addClientForm.reset();
    modalOverlay.classList.add("visible");
  }
  function closeModal() {
    modalOverlay.classList.remove("visible");
  }

  document.getElementById("addClientBtn").addEventListener("click", openModal);
  document.getElementById("emptyAddBtn").addEventListener("click", openModal);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });

  addClientForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearModalError();
    const full_name = document.getElementById("cFullName").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const phone = document.getElementById("cPhone").value.trim();
    const dob = document.getElementById("cDob").value;

    try {
      const res = await fetch(`${BACKEND_URL}/api/clients`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ full_name, email, phone, dob }),
      });
      const data = await res.json();
      if (!res.ok) { showModalError(data.error || "Couldn't add client."); return; }
      closeModal();
      await loadClients();
    } catch (err) {
      showModalError("Couldn't reach the server. Try again.");
    }
  });

  function clientCard(client) {
    const meta = [client.email, client.phone].filter(Boolean).join(" · ");
    const el = document.createElement("a");
    el.href = `client.html?id=${client.id}`;
    el.className = "client-card";
    el.innerHTML = `
      <div>
        <div class="client-name">${escapeHtml(client.full_name)}</div>
        <div class="client-meta">${escapeHtml(meta || "No contact info yet")}</div>
      </div>
      <div class="chevron">›</div>
    `;
    return el;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  // Client-side filter across name, email, and phone. Runs against the
  // already-loaded client list, so it stays instant even with a large
  // roster — no extra round trip to the backend needed.
  function renderFilteredClients() {
    const query = searchInput.value.trim().toLowerCase();

    if (allClients.length === 0) {
      clientList.innerHTML = "";
      emptyState.style.display = "block";
      noMatchState.style.display = "none";
      searchCount.style.display = "none";
      return;
    }
    emptyState.style.display = "none";

    const filtered = query
      ? allClients.filter((c) => {
          const haystack = [c.full_name, c.email, c.phone].filter(Boolean).join(" ").toLowerCase();
          return haystack.includes(query);
        })
      : allClients;

    clientList.innerHTML = "";
    if (filtered.length === 0) {
      noMatchState.style.display = "block";
      searchCount.style.display = "none";
    } else {
      noMatchState.style.display = "none";
      filtered.forEach((c) => clientList.appendChild(clientCard(c)));
      if (query) {
        searchCount.style.display = "block";
        searchCount.textContent = `${filtered.length} of ${allClients.length} clients`;
      } else {
        searchCount.style.display = "none";
      }
    }
  }

  searchInput.addEventListener("input", renderFilteredClients);

  async function loadClients() {
    const res = await fetch(`${BACKEND_URL}/api/clients`, { credentials: "include" });
    if (res.status === 401) { window.location.href = "index.html"; return; }
    allClients = await res.json();
    renderFilteredClients();
  }

  async function loadPractitioner() {
    const res = await fetch(`${BACKEND_URL}/api/me`, { credentials: "include" });
    if (res.status === 401) { window.location.href = "index.html"; return; }
    const me = await res.json();
    document.getElementById("practitionerName").textContent = me.full_name + "'s Practice";
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch(`${BACKEND_URL}/auth/logout`, { method: "POST", credentials: "include" });
    window.location.href = "index.html";
  });

  document.getElementById("exportAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("exportAllBtn");
    const originalText = btn.textContent;
    btn.textContent = "Exporting…";
    btn.disabled = true;
    try {
      const res = await fetch(`${BACKEND_URL}/api/export/all`, { credentials: "include" });
      if (res.status === 401) { window.location.href = "index.html"; return; }
      if (!res.ok) return;
      const data = await res.json();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `all_clients_export_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  loadPractitioner();
  loadClients();
</script>

</body>
</html>

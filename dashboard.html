<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F3EA;
    --ink: #3D3226;
    --ink-soft: #6B5E4F;
    --sage: #6B7A4F;
    --sage-deep: #55613F;
    --sage-pale: #E9EDE2;
    --border: #DCD3BC;
    --rust: #A34A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--parchment);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    background: #FFFEFB;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.25rem;
    margin: 0;
  }
  .logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .logout:hover { border-color: var(--sage); color: var(--sage-deep); }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .toolbar h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0;
  }
  button.primary {
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.primary:hover { background: var(--sage-deep); }

  .client-list { display: flex; flex-direction: column; gap: 10px; }
  .client-card {
    background: #FFFEFB;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .client-card:hover { border-color: var(--sage); }
  .client-name { font-weight: 600; font-size: 0.98rem; }
  .client-meta { color: var(--ink-soft); font-size: 0.8rem; margin-top: 3px; }
  .chevron { color: var(--ink-soft); font-size: 1.1rem; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state p { font-size: 0.9rem; margin-bottom: 20px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61, 50, 38, 0.35);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.visible { display: flex; }
  .modal {
    background: #FFFEFB;
    border-radius: 4px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 20px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    background: var(--parchment);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--sage); outline-offset: 1px; background: #fff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; }
  button.secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 10px 18px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .error {
    background: #FBEFEC;
    border: 1px solid var(--rust);
    color: var(--rust);
    padding: 9px 12px;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-bottom: 14px;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 4 C20 14, 20 26, 20 36" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M20 12 C16 10, 12 11, 10 15" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M20 12 C24 10, 28 11, 30 15" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M20 20 C16 18, 12 19, 10 23" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M20 20 C24 18, 28 19, 30 23" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </svg>
    <h1 id="practitionerName">Practice Dashboard</h1>
  </div>
  <button class="logout" id="logoutBtn">Sign out</button>
</header>

<main>
  <div class="toolbar">
    <h2>Clients</h2>
    <button class="primary" id="addClientBtn">+ Add Client</button>
  </div>

  <div class="client-list" id="clientList"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No clients yet. Add your first client to get started.</p>
    <button class="primary" id="emptyAddBtn">+ Add Client</button>
  </div>
</main>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3>Add a new client</h3>
    <div class="error" id="modalError"></div>
    <form id="addClientForm">
      <div class="field">
        <label for="cFullName">Full name</label>
        <input type="text" id="cFullName" required>
      </div>
      <div class="field">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail">
      </div>
      <div class="field">
        <label for="cPhone">Phone</label>
        <input type="tel" id="cPhone">
      </div>
      <div class="field">
        <label for="cDob">Date of birth</label>
        <input type="date" id="cDob">
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveClientBtn">Add Client</button>
      </div>
    </form>
  </div>
</div>

<script>
  const BACKEND_URL = "https://practitioner-api.val.run";

  const clientList = document.getElementById("clientList");
  const emptyState = document.getElementById("emptyState");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalError = document.getElementById("modalError");
  const addClientForm = document.getElementById("addClientForm");

  function showModalError(msg) {
    modalError.textContent = msg;
    modalError.classList.add("visible");
  }
  function clearModalError() {
    modalError.classList.remove("visible");
  }

  function openModal() {
    clearModalError();
    addClientForm.reset();
    modalOverlay.classList.add("visible");
  }
  function closeModal() {
    modalOverlay.classList.remove("visible");
  }

  document.getElementById("addClientBtn").addEventListener("click", openModal);
  document.getElementById("emptyAddBtn").addEventListener("click", openModal);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });

  addClientForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearModalError();
    const full_name = document.getElementById("cFullName").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const phone = document.getElementById("cPhone").value.trim();
    const dob = document.getElementById("cDob").value;

    try {
      const res = await fetch(`${BACKEND_URL}/api/clients`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ full_name, email, phone, dob }),
      });
      const data = await res.json();
      if (!res.ok) { showModalError(data.error || "Couldn't add client."); return; }
      closeModal();
      await loadClients();
    } catch (err) {
      showModalError("Couldn't reach the server. Try again.");
    }
  });

  function clientCard(client) {
    const meta = [client.email, client.phone].filter(Boolean).join(" · ");
    const el = document.createElement("a");
    el.href = `client.html?id=${client.id}`;
    el.className = "client-card";
    el.innerHTML = `
      <div>
        <div class="client-name">${escapeHtml(client.full_name)}</div>
        <div class="client-meta">${escapeHtml(meta || "No contact info yet")}</div>
      </div>
      <div class="chevron">›</div>
    `;
    return el;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  async function loadClients() {
    const res = await fetch(`${BACKEND_URL}/api/clients`, { credentials: "include" });
    if (res.status === 401) { window.location.href = "index.html"; return; }
    const clients = await res.json();
    clientList.innerHTML = "";
    if (clients.length === 0) {
      emptyState.style.display = "block";
    } else {
      emptyState.style.display = "none";
      clients.forEach((c) => clientList.appendChild(clientCard(c)));
    }
  }

  async function loadPractitioner() {
    const res = await fetch(`${BACKEND_URL}/api/me`, { credentials: "include" });
    if (res.status === 401) { window.location.href = "index.html"; return; }
    const me = await res.json();
    document.getElementById("practitionerName").textContent = me.full_name + "'s Practice";
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch(`${BACKEND_URL}/auth/logout`, { method: "POST", credentials: "include" });
    window.location.href = "index.html";
  });

  loadPractitioner();
  loadClients();
</script>

</body>
</html>

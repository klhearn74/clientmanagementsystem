<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiver & Informed Consent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F3EA;
    --ink: #3D3226;
    --ink-soft: #6B5E4F;
    --sage: #6B7A4F;
    --sage-deep: #55613F;
    --sage-pale: #E9EDE2;
    --border: #DCD3BC;
    --rust: #A34A3A;
    --gold: #B08A4E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--parchment);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  .page-wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 48px 20px 100px;
  }

  .intro-header { text-align: center; margin-bottom: 24px; }
  .intro-header .icon-wrap { display: flex; justify-content: center; margin-bottom: 10px; }
  .intro-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .client-label { font-size: 0.85rem; color: var(--ink-soft); }

  .section {
    background: #FFFEFB;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
  }
  .waiver-text {
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 18px;
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--ink-soft);
    max-height: 320px;
    overflow-y: auto;
    margin-bottom: 22px;
    white-space: pre-line;
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    background: var(--parchment);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--sage); outline-offset: 1px; background: #fff; }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 20px 0;
  }
  .checkbox-row input { width: auto; margin-top: 3px; }
  .checkbox-row label { font-size: 0.88rem; color: var(--ink); font-weight: 400; margin-bottom: 0; }

  button.primary {
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    width: 100%;
  }
  button.primary:hover { background: var(--sage-deep); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .signed-confirm {
    text-align: center;
    padding: 20px 10px;
  }
  .signed-confirm .check {
    font-size: 2.2rem;
    color: var(--sage-deep);
    margin-bottom: 10px;
  }
  .signed-confirm h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 8px;
  }
  .signed-confirm p { color: var(--ink-soft); font-size: 0.9rem; }

  .loading, .error-card {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .error-card {
    background: #FFFEFB;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div id="loadingMsg" class="loading">Loading…</div>
  <div id="errorCard" class="error-card" style="display:none;">
    This link isn't valid. Please contact your practitioner for a new one.
  </div>

  <div id="pageContent" style="display:none;">
    <div class="intro-header">
      <div class="icon-wrap">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
          <path d="M12 30 L28 30 L25.5 38 L14.5 38 Z" fill="#B08A4E"/>
          <rect x="11" y="27.5" width="18" height="3" rx="1.5" fill="#96794A"/>
          <ellipse cx="13.9" cy="23.9" rx="3" ry="7.5" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(-50 13.9 23.9)"/>
          <ellipse cx="16.6" cy="21.8" rx="3" ry="7.8" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(-25 16.6 21.8)"/>
          <ellipse cx="20" cy="20.5" rx="3.2" ry="8.5" fill="#55613F" stroke="#3D3226" stroke-width="0.4" transform="rotate(0 20 20.5)"/>
          <ellipse cx="23.4" cy="21.8" rx="3" ry="7.8" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(25 23.4 21.8)"/>
          <ellipse cx="26.1" cy="23.9" rx="3" ry="7.5" fill="#6B7A4F" stroke="#55613F" stroke-width="0.6" transform="rotate(50 26.1 23.9)"/>
        </svg>
      </div>
      <h1>Liability Waiver & Informed Consent</h1>
      <div class="client-label" id="clientLabel"></div>
    </div>

    <div class="section" id="formSection">
      <div class="waiver-text" id="waiverTextBox"></div>

      <form id="waiverForm">
        <div class="field-row">
          <div class="field">
            <label for="wf_first">First name</label>
            <input type="text" id="wf_first" required>
          </div>
          <div class="field">
            <label for="wf_last">Last name</label>
            <input type="text" id="wf_last" required>
          </div>
        </div>
        <div class="field">
          <label for="wf_date">Date</label>
          <input type="date" id="wf_date" required>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="wf_agree" required>
          <label for="wf_agree">I have read and agree to the terms above.</label>
        </div>

        <button type="submit" class="primary" id="signBtn">Sign Waiver</button>
      </form>
    </div>

    <div class="section signed-confirm" id="signedConfirmSection" style="display:none;">
      <div class="check">✓</div>
      <h2>Waiver signed</h2>
      <p id="signedConfirmText"></p>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://practitioner-api.val.run";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const WAIVER_TEXT = `Liability Waiver & Informed Consent

I understand that my herbalist is not a licensed medical doctor and does not diagnose, treat, or cure disease. The information and recommendations provided are educational and complementary in nature, and are not a substitute for medical care. I agree to continue consulting my physician or other qualified healthcare provider, particularly for any existing medical conditions.

I understand that herbs and supplements may interact with medications, and I agree to disclose all current medications and supplements to my herbalist to the best of my knowledge.

If I am pregnant, nursing, or become pregnant during the course of care, I agree to inform my herbalist immediately.

I understand that no specific results or outcomes are guaranteed.

I take full personal responsibility for my use of any recommendations provided.

I understand that my records will be kept confidential in accordance with my herbalist's privacy practices.`;

  function showSignedConfirm(name, dateStr) {
    document.getElementById("formSection").style.display = "none";
    document.getElementById("signedConfirmSection").style.display = "block";
    const formatted = new Date(dateStr + "T00:00:00").toLocaleDateString();
    document.getElementById("signedConfirmText").textContent = `Signed by ${name} on ${formatted}. You may close this page.`;
  }

  async function load() {
    if (!token) {
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("errorCard").style.display = "block";
      return;
    }
    try {
      const res = await fetch(`${BACKEND_URL}/api/public/waiver/${token}`);
      if (!res.ok) {
        document.getElementById("loadingMsg").style.display = "none";
        document.getElementById("errorCard").style.display = "block";
        return;
      }
      const data = await res.json();
      document.getElementById("clientLabel").textContent = data.client_full_name || "";
      document.getElementById("waiverTextBox").textContent = WAIVER_TEXT;
      document.getElementById("wf_date").value = new Date().toISOString().slice(0, 10);

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("pageContent").style.display = "block";

      if (data.already_signed) {
        showSignedConfirm(data.signed_name || data.client_full_name, data.signed_date);
      }
    } catch {
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("errorCard").style.display = "block";
    }
  }

  document.getElementById("waiverForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("signBtn");
    btn.disabled = true;

    const first = document.getElementById("wf_first").value.trim();
    const last = document.getElementById("wf_last").value.trim();
    const date = document.getElementById("wf_date").value;
    const fullName = `${first} ${last}`.trim();

    try {
      const res = await fetch(`${BACKEND_URL}/api/public/waiver/${token}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ waiver_text: WAIVER_TEXT, signed_name: fullName, signed_date: date }),
      });
      if (res.ok) {
        showSignedConfirm(fullName, date);
      } else {
        btn.disabled = false;
      }
    } catch {
      btn.disabled = false;
    }
  });

  load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F3EA;
    --parchment-deep: #EFE8D8;
    --ink: #3D3226;
    --ink-soft: #6B5E4F;
    --sage: #6B7A4F;
    --sage-deep: #55613F;
    --border: #DCD3BC;
    --rust: #A34A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--parchment);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #FFFEFB;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 44px 36px 36px;
    position: relative;
  }
  .sprig { width: 34px; height: 34px; margin: 0 auto 18px; display: block; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.7rem;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 32px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.92rem;
    background: var(--parchment);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--sage); outline-offset: 1px; background: #fff; }
  button.primary {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: var(--sage);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: var(--sage-deep); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .switch-mode { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--ink-soft); }
  .switch-mode button {
    background: none;
    border: none;
    color: var(--sage-deep);
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    text-decoration: underline;
    padding: 0;
  }
  .error {
    background: #FBEFEC;
    border: 1px solid var(--rust);
    color: var(--rust);
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    display: none;
  }
  .error.visible { display: block; }
  .dashboard { display: none; text-align: center; }
  .dashboard.visible { display: block; }
  .card.dashboard-mode { max-width: 460px; }
  .dashboard h1 { margin-bottom: 6px; }
  .dashboard p { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 28px; }
  .logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 9px 18px;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .logout:hover { border-color: var(--sage); color: var(--sage-deep); }
</style>
</head>
<body>

<div class="card" id="authCard">
  <svg class="sprig" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 4 C20 14, 20 26, 20 36" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M20 12 C16 10, 12 11, 10 15" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M20 12 C24 10, 28 11, 30 15" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M20 20 C16 18, 12 19, 10 23" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M20 20 C24 18, 28 19, 30 23" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M20 28 C17 27, 14 28, 13 31" stroke="#6B7A4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </svg>
  <h1 id="formTitle">Welcome back</h1>
  <p class="subtitle">Practice Dashboard</p>
  <div class="error" id="errorBox"></div>
  <form id="authForm">
    <div class="field" id="nameField" style="display:none;">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" autocomplete="name">
    </div>
    <div class="field" id="credentialsField" style="display:none;">
      <label for="credentials">Title / credentials</label>
      <input type="text" id="credentials" placeholder="e.g. Herbalist & Metabolic Health Consultant" autocomplete="off">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primary" id="submitBtn">Sign in</button>
  </form>
  <div class="switch-mode">
    <span id="switchPrompt">New here?</span>
    <button type="button" id="switchBtn">Create an account</button>
  </div>
</div>

<script>
  const BACKEND_URL = "https://practitioner-api.val.run";
  let mode = "login";

  const authCard = document.getElementById("authCard");
  const form = document.getElementById("authForm");
  const errorBox = document.getElementById("errorBox");
  const formTitle = document.getElementById("formTitle");
  const nameField = document.getElementById("nameField");
  const credentialsField = document.getElementById("credentialsField");
  const submitBtn = document.getElementById("submitBtn");
  const switchPrompt = document.getElementById("switchPrompt");
  const switchBtn = document.getElementById("switchBtn");

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add("visible"); }
  function clearError() { errorBox.classList.remove("visible"); }

  switchBtn.addEventListener("click", () => {
    clearError();
    mode = mode === "login" ? "signup" : "login";
    if (mode === "signup") {
      formTitle.textContent = "Create your account";
      nameField.style.display = "block";
      credentialsField.style.display = "block";
      submitBtn.textContent = "Create account";
      switchPrompt.textContent = "Already have an account?";
      switchBtn.textContent = "Sign in";
    } else {
      formTitle.textContent = "Welcome back";
      nameField.style.display = "none";
      credentialsField.style.display = "none";
      submitBtn.textContent = "Sign in";
      switchPrompt.textContent = "New here?";
      switchBtn.textContent = "Create an account";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    submitBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      if (mode === "signup") {
        const fullName = document.getElementById("fullName").value.trim();
        const credentials = document.getElementById("credentials").value.trim();
        if (!fullName) { showError("Please enter your name."); submitBtn.disabled = false; return; }
        const res = await fetch(`${BACKEND_URL}/auth/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password, full_name: fullName, credentials }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || "Something went wrong."); submitBtn.disabled = false; return; }
        await doLogin(email, password);
      } else {
        await doLogin(email, password);
      }
    } catch (err) {
      showError("Couldn't reach the server. Check your connection and try again.");
      submitBtn.disabled = false;
    }
  });

  async function doLogin(email, password) {
    const res = await fetch(`${BACKEND_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Invalid email or password."); submitBtn.disabled = false; return; }
    window.location.href = "dashboard.html";
  }

  async function checkAlreadyLoggedIn() {
    const res = await fetch(`${BACKEND_URL}/api/me`, { credentials: "include" });
    if (res.ok) window.location.href = "dashboard.html";
  }

  checkAlreadyLoggedIn();
</script>

</body>
</html>
